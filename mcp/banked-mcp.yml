notes: >-
  Banked ships an official hosted MCP server for agent-driven payments. The
  example-agents repository demonstrates connecting to it. The server requires
  OAuth 2.0 (client credentials): BANKED_OAUTH_CLIENT_ID, _CLIENT_SECRET, and
  _CLIENT_SCOPE (the business application ID), exchanged at the token endpoint.
  Endpoint returned HTTP 401 to an unauthenticated probe, confirming it is live
  and auth-gated.
server:
  name: banked
  transport: http
  url: https://mcp.banked.com
  auth:
    type: oauth2
    flow: client_credentials
    token_url: https://api.banked.com/oauth/token
    env:
    - BANKED_OAUTH_CLIENT_ID
    - BANKED_OAUTH_CLIENT_SECRET
    - BANKED_OAUTH_CLIENT_SCOPE
