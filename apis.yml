aid: banked
name: Banked
description: >-
  Banked is a global account-to-account (A2A) payments network built on open
  banking that enables real-time pay-by-bank payments for consumers, businesses,
  and banks. Its API-first platform provides hosted Checkout, Payment Links and
  QR codes, Payouts, Refunds, Reporting, loyalty (Incentivize), and fraud
  protection, using bank-native biometric authentication and Strong Customer
  Authentication (SCA) to move money securely with minimal chargebacks. A single
  Payments API and Partner API integration gives merchants and platforms access
  across multiple markets, and Banked ships an official hosted MCP server so
  agents can create, search, and refund payments over OAuth 2.0.
